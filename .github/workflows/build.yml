name: Build The Docs

on:
  push:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
    - name: Install deps
      run: npm ci
    - name: Ensure the Docs Builds
      run: npm run build
